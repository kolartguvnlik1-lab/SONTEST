<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOLART Elite - Command Insights</title>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        if (!sessionStorage.getItem("currentUser") && !localStorage.getItem("siteID")) {
            window.location.replace("index.html");
        }
    </script>

    <style>
        :root {
            --main-lime: #CCFF00;
            --main-red: #FF3B30;
            --bg-black: #050505;
            --card-bg: rgba(30, 30, 30, 0.6);
            --sub-text: #a0a0a5;
            --border: rgba(255, 255, 255, 0.08);
            --danger: #FF4D4D;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--bg-black); 
            background-image: radial-gradient(circle at top right, #1a1a00 0%, #050505 40%);
            color: #fff; padding: 20px 10px 120px 10px;
            line-height: 1.4;
        }

        /* --- STATS & DATE --- */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; padding: 0 10px; }
        .stat-box { background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 12px; border-radius: 18px; text-align: center; }
        .stat-box.clickable { cursor: pointer; transition: 0.3s; }
        .stat-box.clickable:active { transform: scale(0.95); background: rgba(255, 59, 48, 0.1); }
        .stat-label { font-size: 9px; color: var(--sub-text); text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 20px; font-weight: 800; display: block; }

        .date-nav {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.03); border-radius: 15px; padding: 5px;
            margin: 0 10px 25px 10px; border: 1px solid var(--border);
        }
        .nav-btn { background: none; border: none; color: var(--main-lime); width: 40px; height: 40px; font-size: 18px; cursor: pointer; }

        /* --- ELITE HORIZONTAL CARD --- */
        .patrol-card {
            background: var(--card-bg); backdrop-filter: blur(25px);
            border-radius: 25px; margin-bottom: 16px;
            border: 1px solid var(--border); overflow: hidden;
            transition: 0.3s;
        }
        .patrol-card.is-full { border-left: 5px solid var(--main-lime); box-shadow: -5px 0 15px rgba(204, 255, 0, 0.1); }
        .patrol-card.is-missing { border-left: 5px solid var(--main-red); box-shadow: -5px 0 15px rgba(255, 59, 48, 0.1); }
        .card-body { display: flex; padding: 20px; gap: 15px; }
        .info-container { flex: 1; }
        .data-row { display: flex; align-items: center; margin-bottom: 8px; }
        .label { font-size: 10px; color: var(--sub-text); width: 85px; font-weight: 600; text-transform: uppercase; }
        .value { font-size: 13px; font-weight: 700; color: #fff; }
        .val-name { color: var(--main-lime); font-size: 15px; }
        .val-dur { background: rgba(204, 255, 0, 0.1); padding: 4px 10px; border-radius: 8px; color: var(--main-lime); }
        .side-actions { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-width: 110px; border-left: 1px solid rgba(255,255,255,0.05); padding-left: 15px; }
        .status-badge { font-size: 9px; font-weight: 800; padding: 6px 12px; border-radius: 10px; text-align: center; text-transform: uppercase; min-width: 100px; }
        .bg-full { background: rgba(52, 199, 89, 0.15); color: #34C759; border: 1px solid rgba(52, 199, 89, 0.2); }
        .bg-missing { background: rgba(255, 59, 48, 0.15); color: #FF3B30; border: 1px solid rgba(255, 59, 48, 0.2); }
        .note-btn { background: rgba(204, 255, 0, 0.15); border: 1px solid var(--main-lime); width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .note-btn img { width: 22px; filter: invert(1); }
        .detail-bar { background: rgba(255,255,255,0.03); border-top: 1px solid rgba(255,255,255,0.05); padding: 12px; text-align: center; color: #fff; font-size: 11px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .timeline-pane { display: none; padding: 15px; background: rgba(0,0,0,0.3); border-top: 1px solid rgba(255,255,255,0.03); }
        .t-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 12px; padding-left: 15px; position: relative; }
        .t-row::before { content: ''; position: absolute; left: 0; top: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--main-lime); }
        .t-row.missed::before { background: var(--main-red); }

        /* --- ELITE MODAL --- */
        .elite-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); backdrop-filter: blur(15px); display: none; flex-direction: column; z-index: 5000; padding: 25px; }
        .modal-content { background: #111; width: 100%; max-height: 85vh; border-radius: 35px; padding: 30px; overflow-y: auto; border: 1px solid #222; align-self: center; margin: auto; }
        .summary-content { flex: 1; overflow-y: auto; margin: 20px 0; padding-right: 5px; }
        .summary-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255, 59, 48, 0.2); border-radius: 20px; padding: 15px; margin-bottom: 15px; }
        .summary-card h4 { color: var(--main-lime); font-size: 14px; margin-bottom: 5px; }
        .summary-card p { font-size: 12px; color: #ccc; margin-bottom: 10px; }
        .missed-point-tag { color: var(--main-red); font-size: 11px; display: block; margin-bottom: 3px; }
        .missed-point-tag::before { content: '✕ '; font-weight: 800; }
        
        .modal-box { background: #0a0a0a; border: 1px solid var(--main-lime); width: 100%; max-width: 400px; border-radius: 30px; padding: 30px; text-align: center; box-shadow: 0 0 30px rgba(204, 255, 0, 0.15); align-self: center; margin: auto; }
        .m-close { background: var(--main-lime); color: #000; border: none; padding: 15px; border-radius: 15px; font-weight: 800; width: 100%; cursor: pointer; margin-top: 10px; }

        /* --- YENİ EKLENEN ALT NAV VE BUTON STİLLERİ --- */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; width: 100%; height: 85px; 
            background: #000; display: flex; justify-content: space-around; 
            align-items: center; border-top: 1px solid rgba(255,255,255,0.05); z-index: 1000; 
            padding-bottom: 15px;
        }
        .nav-item { text-align: center; text-decoration: none; color: var(--sub-text); font-size: 9px; font-weight: 600; cursor: pointer; flex: 1; position: relative; transition: all 0.3s ease; }
        .nav-item img { display: block; margin: 0 auto 5px; width: 22px; height: 22px; opacity: 0.6; }
        .nav-item.active { color: var(--main-lime); }
        .nav-item.active img { filter: invert(1); opacity: 1; }

        .has-alert img {
            filter: drop-shadow(0 0 12px #FF4D4D) invert(1) sepia(1) saturate(10) hue-rotate(-50deg) !important;
            animation: alert-siren 0.8s infinite alternate ease-in-out;
            opacity: 1 !important;
        }
        .has-alert { color: var(--danger) !important; text-shadow: 0 0 5px rgba(255, 77, 77, 0.5); }
        @keyframes alert-siren { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.15); opacity: 1; } }

        .event-badge { position: absolute; top: -5px; right: 20%; background: var(--danger); color: #fff; font-size: 9px; font-weight: 800; padding: 2px 7px; border-radius: 8px; display: none; box-shadow: 0 0 15px var(--danger); z-index: 10; }

        .btn-prime { background: var(--main-lime); color: #000; border: none; padding: 18px; border-radius: 20px; width: 100%; font-weight: 700; font-size: 14px; margin-top: 10px; }
        .dir-item { background: #1a1a1a; padding: 15px; border-radius: 20px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; text-align: left; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #111; color: var(--main-lime); border: 1px solid var(--main-lime); padding: 15px 30px; border-radius: 50px; font-size: 13px; font-weight: 600; z-index: 9999; display: none; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { top: -50px; opacity: 0; } to { top: 20px; opacity: 1; } }
        .loader { width: 30px; height: 30px; border: 2px solid rgba(255,255,255,0.1); border-top-color: var(--main-lime); border-radius: 50%; animation: spin 1s linear infinite; margin: 50px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="toastNotify" class="toast"></div>

    <div class="stats-grid">
        <div class="stat-box">
            <span class="stat-label">Toplam Devriye</span>
            <span id="totalCount" class="stat-value" style="color:var(--main-lime)">0</span>
        </div>
        <div class="stat-box clickable" onclick="openSummaryModal()">
            <span class="stat-label">Eksik Devriye</span>

    <div class="date-nav">
        <button class="nav-btn" onclick="changeDate(-1)">❮</button>

        <button class="nav-btn" onclick="changeDate(1)">❯</button>

    <div id="patrolContainer"></div>

    <div id="summaryModal" class="elite-modal">
        <div class="modal-content">
            <h3 style="color:var(--main-red); text-align:center; font-weight:800; letter-spacing:1px;">GÜNLÜK EKSİK ÖZETİ</h3>
            <div id="summaryList" class="summary-content"></div>
            <button class="m-close" onclick="closeSummaryModal()">KAPAT</button>

    <div id="noteModal" class="elite-modal" style="justify-content:center; align-items:center;">
        <div class="modal-box">
            <h3 style="color:var(--main-lime); margin-bottom:15px; font-size:18px;">EKSİK DEVRIYE NOTU</h3>
            <p id="noteText" style="color:#ccc; font-size:14px; line-height:1.6;"></p>
            <button class="m-close" onclick="closeNoteModal()">ANLADIM</button>

    <div id="generalModal" class="elite-modal">

    <nav class="bottom-nav">
        <a href="amir.html" class="nav-item">
            <img src="https://cdn-icons-png.flaticon.com/512/25/25694.png" style="filter: invert(1);"> Ana Sayfa

        <div class="nav-item" onclick="openDirectoryModal()">

    </nav>
