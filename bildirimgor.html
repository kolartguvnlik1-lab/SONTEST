<div class="container">
    <div class="header-bar">
        <button class="icon-btn-back" id="topBackBtn" title="Ana Sayfaya Dön">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <h1>BİLDİRDİĞİM OLAYLAR</h1>
        <div style="width: 36px;"></div> <!-- Dengeleyici boşluk -->
    </div>

    <div class="user-card">
        <div><strong>Görevli:</strong> <span id="userNameLbl">Yükleniyor...</span></div>
        <div id="recordCount" style="color: var(--primary); font-weight: bold;"></div>

    <div class="info-note-card">
        <div class="info-note-icon">💡</div>
        <div class="info-note-text">

        </div>
    </div>

    <div class="filter-group">
        <select id="monthSelect">
            <option value="">Aylar Taranıyor...</option>
        </select>

        <select id="daySelect" disabled>
            <option value="">Önce Ay Seçiniz</option>
        </select>
    </div>

    <div class="loader" id="loader"></div>
    <div id="infoMessage">Veriler başlatılıyor...</div>
    <div id="eventsList"></div>

    <div class="btn-group">
        <button id="backToFormBtn">
            <span>📝</span> OLAY BİLDİRİMİNE DÖN
        </button>
        <button id="backToHomeBtn">
            <span>🏠</span> ANA SAYFAYA DÖN
        </button>
    </div>
</div>

<div id="imageModal" class="img-modal">
    <span class="close-modal" onclick="closeModal()">&times;</span>
    <img class="modal-content" id="modalImage">
</div>
