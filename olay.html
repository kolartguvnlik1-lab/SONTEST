<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOLART - Durum Bildir</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script>
        const savedTheme = localStorage.getItem('kolart-theme-tone') || 'elite-neon';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    
    <style>

<body>

<div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loaderTitle">OLAY KAYDEDİLİYOR...</div>
</div>

<div class="container">
    <!-- Kırmızı Vurgulu Aktif Devriye Banner'ı (Opak Koyu Kırmızı) -->
      <!-- Kırmızı Vurgulu Aktif Devriye Banner'ı -->
        <div id="active-devriye-banner" style="display: none; align-items: center; justify-content: space-between; background: rgba(255, 77, 77, 0.12); border: 1px solid #ff4d4d; padding: 10px 14px; border-radius: 20px; margin-bottom: 20px; backdrop-filter: blur(5px); box-shadow: 0 0 15px rgba(255, 77, 77, 0.25);">
            <div style="display: flex; align-items: center; gap: 8px;">
                <span class="live-dot"></span>
                <span id="devriye-banner-text" style="font-size: 11px; font-weight: 800; letter-spacing: 0.5px; color: #ffffff; text-transform: uppercase;">
                    <!-- Dinamik devriye saati buraya gelecek -->
                </span>
            </div>
        </div>

    <h1>DURUM BİLDİRİMİ</h1>

    <div class="status-info">
        <strong>Rapor No:</strong> <span id="raporNoLabel">...</span><br>
        <strong>Görevli:</strong> <span id="displayName">Tespit ediliyor...</span>
    </div>

    <label>Görev Yeri / Blok <span>*</span></label>
    <input type="text" id="olayLocation" placeholder="Örn: A Blok Giriş" required>

    <label>Tespit Yeri <span>*</span></label>
    <input type="text" id="tespitYeri" placeholder="Örn: 3. Kat Koridor" required>

    <label>Tespitin Konusu <span>*</span></label>
    <input type="text" id="tespitKonusu" placeholder="Örn: Kapı Açık / Rutin" required>

    <label>Durum Detayı ve Yorum <span>*</span></label>
    <textarea id="olayDesc" maxlength="1350" placeholder="Detayları buraya yazınız..." required></textarea>
    <div id="charCounter" class="char-counter">0 / 1350</div>

    <div id="photoBtns">
        <button id="takePhotoBtn">📷 Foto Çek</button>
        <button id="choosePhotoBtn">📁 Galeri</button>
    </div>
    <img id="preview">
    <input type="file" id="galleryInput" accept="image/*" style="display:none;">

    <button id="submitBtn">OLAYI GÖNDER</button>
	<button id="viewReportsBtn" style="background: transparent; color: var(--primary); border: 1px solid var(--primary); margin-top: 15px;">YAPTIĞIN BİLDİRİMLERİ GÖR</button>
	<button id="backBtn">GÜVENLİK PANELİNE DÖN</button>

    <div id="message" style="text-align:center; margin-top:15px; font-weight:bold;"></div>
</div>

<div id="cameraModal">
    <div id="flashBtn">⚡</div>
    <video id="video" autoplay playsinline></video>
    <div style="display:flex; gap:15px; margin-top:20px; width: 90%; max-width: 400px;">
        <button id="snapBtn" style="background:var(--primary); color:var(--on-primary); flex: 2;">ÇEK</button>
        <button id="closeModalBtn" style="background:var(--surface-container); color:#fff; flex: 1;">İPTAL</button>
    </div>
</div>
