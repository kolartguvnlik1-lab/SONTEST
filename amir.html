<!-- BODY ETİKETİNE SAĞ TIK, SEÇİM VE SÜRÜKLEME ENGELLEYİCİLERİ EKLENDİ -->
<body oncontextmenu="return false;" onselectstart="return false;" ondragstart="return false;">

<div id="toast" class="toast-system"></div>

<header class="top-bar">
    <div class="brand-logo">KOD<span>DENETİM</span></div>
    <div class="system-status">
        <div class="status-dot"></div> ONLINE
    </div>
</header>

<div class="hero-panel">
    <div class="hero-subtitle">Hoşgeldiniz...</div>
    <div class="hero-title" id="userName">-- --</div>
    <div class="location-tag"><i class="fa-solid fa-satellite-dish"></i> <span id="siteName">VERİ BEKLENİYOR...</span></div>
</div>

<div class="stats-grid">
    <div class="stat-module blue" onclick="location.href='amirdev.html'">
        <i class="fa-solid fa-route stat-icon"></i>
        <div class="stat-title">TAMAMLANAN</div>
        <div class="stat-value" id="totalPatrol">0</div>
    </div>
    <div class="stat-module red" onclick="openMissingModal()">
        <i class="fa-solid fa-triangle-exclamation stat-icon"></i>
        <div class="stat-title">İHLAL / EKSİK</div>
        <div class="stat-value" id="missingPatrol">0</div>
    </div>
</div>

<div class="time-control">
    <button class="time-btn" id="prevDate"><i class="fa-solid fa-angle-left"></i></button>
    <div class="time-display" id="dateText">--.--.----</div>
    <button class="time-btn" id="nextDate"><i class="fa-solid fa-angle-right"></i></button>
</div>

<div class="feed-container">
    <div class="feed-header">
        <div class="feed-title"><i class="fa-solid fa-tower-observation" style="color:var(--neon-blue); margin-right:8px;"></i> SAHA RADARI</div>
        <div class="feed-count">[ AKTİF: <span id="activeCount">0</span> ]</div>
    </div>
    <div id="guardList">
        <!-- JS ile Personel Kartları Buraya Gelecek -->
    </div>
</div>

<nav class="bottom-nav">
    <div class="nav-btn active"><i class="fa-solid fa-network-wired"></i><span>PANEL</span></div>
    <div class="nav-btn" onclick="goToEvents()" id="eventBtn">
        <div class="alert-dot" id="eventBadge"></div>
        <i class="fa-solid fa-bolt"></i><span>OLAYLAR</span>
    </div>
    <div class="nav-btn" onclick="openProfile()"><i class="fa-solid fa-fingerprint"></i><span>GÜVENLİK</span></div>
    <div class="nav-btn" onclick="goHome()">
        <i class="fa-solid fa-power-off"></i><span>ÇIKIŞ</span>
    </div>
</nav>

<div id="modal" class="cyber-modal">
    <div class="modal-box" id="modalContent"></div>
</div>
