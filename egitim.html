<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOD ONLİNE DENETİM - Eğitim Portalı</title>
    <style>
        :root {
            --bg-color: #09090b; 
            --card-bg: #18181b;
            --card-hover: #27272a;
            --primary-color: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --success-color: #10b981;
            --success-glow: rgba(16, 185, 129, 0.4);
            --text-main: #f8fafc;
            --text-muted: #a1a1aa;
            --border-color: #27272a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 60px; /* Buton için alt boşluk */
        }

        /* Glassmorphism Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(9, 9, 11, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 20px;
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* Video Oynatıcı Alanı */
        .player-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .video-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 16px;
            gap: 12px;
        }

        .current-video-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            text-align: center;
        }

        /* Tam Ekran Butonu */
        .fullscreen-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px var(--primary-glow);
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }

        .fullscreen-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px var(--primary-glow);
        }

        .fullscreen-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.5); }
            70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        /* Modül Grid Alanı */
        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        @media (min-width: 640px) {
            .dashboard-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (min-width: 1024px) {
            .dashboard-grid { grid-template-columns: repeat(4, 1fr); }
        }

        /* Aksiyon Kartları */
        .action-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px 12px;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .action-card:hover {
            background-color: var(--card-hover);
            border-color: #52525b;
            transform: translateY(-4px);
        }

        .action-card.active-tab {
            border-color: var(--primary-color);
            background: linear-gradient(145deg, rgba(59, 130, 246, 0.1), rgba(59, 130, 246, 0.05));
            box-shadow: inset 0 0 0 1px var(--primary-color), 0 8px 16px rgba(0,0,0,0.2);
        }

        .action-icon {
            font-size: 2.2rem;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
            transition: transform 0.3s ease;
        }

        .action-card:active .action-icon {
            transform: scale(0.9);
        }

        .action-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.2;
        }

        /* Yükleniyor Animasyonu */
        .loader-container {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
            color: var(--text-muted);
            gap: 12px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* EĞİTİMİ BİTİR BUTONU */
        .finish-container {
            margin-top: 40px;
            padding: 20px 0;
            text-align: center;
            border-top: 1px dashed var(--border-color);
        }

        .finish-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--success-color), #059669);
            color: white;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            box-shadow: 0 4px 15px var(--success-glow);
            transition: all 0.3s ease;
            width: 100%;
            max-width: 400px;
        }

        .finish-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px var(--success-glow);
            background: linear-gradient(135deg, #34d399, var(--success-color));
        }

        .finish-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

    </style>
</head>

        <!-- Üst Oynatıcı Bölümü -->
        <div class="player-section" id="playerSection">
            <div class="video-wrapper">
                <video id="mainPlayer" controls playsinline preload="metadata">

            <div class="video-info">
