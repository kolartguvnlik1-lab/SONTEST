<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güvenlik Kimlik Kartım | KOLART</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
	.back-btn,body{color:var(--text)}#auth-loading,#toast{position:fixed;font-size:13px}:root{--bg-color:#0d1117;--card-bg:#161b22;--primary:#00f2fe;--primary-glow:rgba(0, 242, 254, 0.25);--text:#e6edf3;--text-muted:#8b949e;--border:#30363d;--error:#ff4d4d;--success:#2ea043;--warning:#d29922}*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}body{background-color:var(--bg-color);padding:20px;min-height:100vh;overflow-y:auto;padding-bottom:120px!important}.container{width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:20px}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}.back-btn{background:0 0;border:none;cursor:pointer;display:flex;align-items:center;gap:5px;font-size:14px}.id-card{background:linear-gradient(135deg,#f8fafc 0,#e2e8f0 100%);border:1px solid #cbd5e1;box-shadow:0 10px 25px rgba(0,0,0,.4);border-radius:16px;padding:20px;position:relative;overflow:hidden;color:#0f172a}.id-card::before{content:'';position:absolute;right:25px;top:55px;width:110px;height:70px;background-image:url("yıldız.png");background-repeat:no-repeat;background-position:center;background-size:contain;opacity:.25;pointer-events:none;z-index:1}.id-card-content{position:relative;z-index:2}.id-card-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #cbd5e1;padding-bottom:10px;margin-bottom:15px}.id-card-body,.id-card-title{align-items:center;display:flex}.id-card-title{font-size:13px;font-weight:800;color:#0f172a;letter-spacing:.5px;gap:6px}.badge-type{background:#1e293b;color:#fff;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.5px}.id-card-body{gap:15px}.avatar-box{width:75px;height:90px;border-radius:8px;background:#fff;border:2px solid #94a3b8;display:flex;align-items:center;justify-content:center;color:#64748b;box-shadow:0 2px 4px rgba(0,0,0,.05)}.info-group{display:flex;flex-direction:column;gap:6p column;gap:14px;background:#0d1117;color:var(--primary);font-weight:800;letter-spacing:1px}#auth-loading .material-symbols-outlined{font-size:42px;animation:1s linear infinite spin}#toast{bottom:90px;left:50%;transform:translateX(-50%);border:1px solid var(--primary);padding:12px 24px;border-radius:8px;display:none;z-index:9999;box-shadow:0 5px 15px rgba(0,0,0,.5);width:85%;max-width:400px;text-align:center}
</style>
</head>
<body>

<div id="auth-loading">
    <span class="material-symbols-outlined">sync</span>
    <span>GİRİŞ DOĞRULANIYOR...</span>
</div>

<div class="container">
    <div class="header">
        <button class="back-btn" onclick="window.history.back()">
            <span class="material-symbols-outlined">arrow_back</span> Geri
        </button>
    </div>

    <div class="id-card">
        <div class="id-card-content">
            <div class="id-card-header">
                <span class="id-card-title">
                    <span class="material-symbols-outlined" style="font-size:18px;">badge</span>
                    T.C. ÖZEL GÜVENLİK KİMLİĞİ
                </span>
                <span class="badge-type" id="preview-silah">SİLAHSIZ</span>
            </div>
            <div class="id-card-body">
                <div class="avatar-box">
                    <span class="material-symbols-outlined" style="font-size:42px;">person</span>
                </div>
                <div class="info-group">
                    <div>
                        <div class="info-label">Ad Soyad</div>
                        <div class="info-val" id="preview-name">YÜKLENİYOR...</div>
                    </div>
                    <div style="display: flex; justify-content: space-between; width: 100%; align-items: flex-end;">
                        <div>
                            <div class="info-label">Kan Grubu</div>
                            <div class="info-val" style="color: #b91c1c;" id="preview-kan">-</div>
                        </div>
                        <div style="text-align: right;">
                            <div class="info-label">Geçerlilik Tarihi</div>
                            <div class="info-val" id="preview-tarih">--/--/----</div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="status-container" style="text-align: right;">
                <span class="status-pill status-active" id="preview-status">Kimlik Geçerlilik Süresi: Tarih Bekleniyor</span>
            </div>
        </div>
    </div>

    <button id="btn-edit-toggle" class="btn-edit" onclick="showForm()">
        <span class="material-symbols-outlined">edit</span> KART BİLGİLERİNİ DÜZENLE
    </button>

    <div class="form-card" id="form-container" style="display: none;">
        <div class="form-notice">
            <span class="material-symbols-outlined" style="color: var(--primary);">info</span>
            <span>Güvenlik kimlik kartınızın arka yüzündeki geçerlilik tarihini ve diğer bilgilerinizi eksiksiz giriniz.</span>
        </div>

        <div class="form-group">
            <label>Geçerlilik Bitiş Tarihi (Gün/Ay/Yıl)</label>
            <input type="text" id="input-tarih" inputmode="numeric" placeholder="GG/AA/YYYY" maxlength="10" class="form-control" oninput="formatDateInput(this)">
        </div>

        <div class="form-group">
            <label>Kimlik Niteliği</label>
            <select id="input-silah" class="form-control" onchange="updatePreview()">
                <option value="">Seçiniz</option>
                <option value="Silahsız">Silahsız Özel Güvenlik</option>
                <option value="Silahlı">Silahlı Özel Güvenlik</option>
            </select>
        </div>

        <div class="form-group">
            <label>Kan Grubu</label>
            <select id="input-kan" class="form-control" onchange="updatePreview()">
                <option value="">Seçiniz</option>
                <option value="A RH (+)">A RH (+)</option>
                <option value="A RH (-)">A RH (-)</option>
                <option value="B RH (+)">B RH (+)</option>
                <option value="B RH (-)">B RH (-)</option>
                <option value="AB RH (+)">AB RH (+)</option>
                <option value="AB RH (-)">AB RH (-)</option>
                <option value="0 RH (+)">0 RH (+)</option>
                <option value="0 RH (-)">0 RH (-)</option>
            </select>
        </div>

        <button id="btn-save" class="btn-save" onclick="saveKimlikData()">
            <span class="material-symbols-outlined" id="save-icon">save</span> <span id="save-text">KART BİLGİLERİNİ KAYDET</span>
        </button>
        
        <div style="height: 80px; width: 100%; display: block;"></div>
    </div>
</div>

<div id="toast"></div>
