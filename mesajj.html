<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KOLART — TALİMATLAR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
	<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <script>
        const savedTheme = localStorage.getItem('kolart-theme-tone') || 'elite-neon';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <style>
        :root,html[data-theme=elite-neon]{--primary:#CCFF00;--bg-dark:#080808;--surface:#0C0C0C;--surface-container:#161616;--card-bg:#1a1f00;--card-border:#CCFF00;--primary-glow:rgba(204, 255, 0, 0.2)}
        :root{--on-primary:#000000;--text-main:#ffffff;--text-muted:rgba(255, 255, 255, 0.4);--border:rgba(255, 255, 255, 0.08);--error:#FF4D4D;--safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom);--project-accent:#FFD700;--on-primary:#000}
        
        /* DİĞER TEMALAR */
        html[data-theme=cyber-cyan]{--primary:#00E5FF;--on-primary:#000;--bg-dark:#050A0C;--surface:#0A1013;--surface-container:#121A1D;--card-bg:#00191f;--card-border:#00E5FF;--primary-glow:rgba(0, 229, 255, 0.25)}
        html[data-theme=hex-purple]{--primary:#bd00ff;--on-primary:#fff;--bg-dark:#08050a;--surface:#0c0a0e;--surface-container:#16121a;--card-bg:#17001f;--card-border:#bd00ff;--primary-glow:rgba(189, 0, 255, 0.25)}
        html[data-theme=deep-orange]{--primary:#ff5500;--on-primary:#fff;--bg-dark:#0a0805;--surface:#0e0c0a;--surface-container:#1a1612;--card-bg:#1f0f00;--card-border:#ff5500;--primary-glow:rgba(255, 85, 0, 0.25)}
        html[data-theme=electric-blue]{--primary:#0066ff;--on-primary:#fff;--bg-dark:#050608;--surface:#0a0b0d;--surface-container:#12141a;--card-bg:#000d1f;--card-border:#0066ff;--primary-glow:rgba(0, 102, 255, 0.25)}
        html[data-theme=matrix-green]{--primary:#00ff66;--on-primary:#000;--bg-dark:#050805;--surface:#0a0d0a;--surface-container:#121a12;--card-bg:#001f0d;--card-border:#00ff66;--primary-glow:rgba(0, 255, 102, 0.25)}
        html[data-theme=ruby-red]{--primary:#ff0055;--on-primary:#fff;--bg-dark:#080506;--surface:#0d0a0b;--surface-container:#1a1214;--card-bg:#1f000a;--card-border:#ff0055;--primary-glow:rgba(255, 0, 85, 0.25)}

        body { background-color: var(--bg-dark); color: var(--text-main); font-family: Inter, sans-serif; min-height: 100vh; display: flex; justify-content: center; margin: 0; padding: 0; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        .app-container { background-color: var(--surface); width: 100%; max-width: 390px; min-height: 100vh; display: flex; flex-direction: column; border-left: 1px solid var(--border); border-right: 1px solid var(--border); position: relative; }
        
        header { padding: calc(16px + var(--safe-top)) 20px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: rgba(12,12,12,.9); backdrop-filter: blur(15px); position: sticky; top: 0; z-index: 1000; }
        .back-btn { font-size: 11px; gap: 8px; display: flex; background: rgba(255,255,255,.05); border: 1px solid var(--border); color: var(--primary); padding: 10px 16px; border-radius: 12px; font-weight: 900; text-decoration: none; align-items: center; }
        .section-title { font-size: 11px; gap: 8px; display: flex; font-weight: 900; text-transform: uppercase; color: var(--text-muted); margin-bottom: 20px; letter-spacing: 1.5px; align-items: center; }
        
        main { flex: 1; padding: 20px 16px 120px; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-card { background: var(--surface-container); border: 1px solid var(--border); border-radius: 24px; padding: 20px; margin-bottom: 16px; position: relative; transition: .3s; animation: fadeInUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
        .msg-card.unread { border-left: 4px solid var(--primary); box-shadow: 0 10px 30px var(--primary-glow); }
        .msg-card.bayram-card { border-left: 4px solid #FFD700; background: linear-gradient(145deg, rgba(255, 215, 0, 0.05) 0%, rgba(0,0,0,0) 100%); }
        
        .msg-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .sender-info { font-size: 12px; color: var(--primary); gap: 6px; display: flex; align-items: center; font-weight: 900; text-transform: uppercase; }
        .bayram-card .sender-info { color: #FFD700; }
        .time { font-size: 10px; color: var(--text-muted); font-family: monospace; font-weight: 700; }
        .content { font-size: 14px; line-height: 1.6; color: rgba(255,255,255,.9); margin-bottom: 20px; white-space: pre-wrap; word-break: break-word; }
        
        .btn-confirm { width: 100%; cursor: pointer; padding: 16px; background: var(--primary); color: #000; border: none; border-radius: 16px; font-size: 13px; display: flex; justify-content: center; align-items: center; gap: 10px; transition: .2s; font-weight: 900; }
        .btn-confirm:active { transform: scale(.96); }
        .btn-confirm:disabled { background: rgba(255,255,255,.05); color: var(--text-muted); cursor: default; }

        /* VİDEO VE MEDYA BİLEŞENLERİ */
        .media-container { margin: 15px 0 10px 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); background: #000; position: relative; }
        .media-container img { width: 100%; display: block; max-height: 350px; object-fit: contain; cursor: pointer; }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
        .video-wrapper video, .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; outline: none; background: #000; }
        
        /* TAM EKRAN TETİKLEYİCİ BUTON */
        .btn-fs-trigger { display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(255,255,255,0.05); color: var(--primary); padding: 12px; border-radius: 12px; font-weight: 900; font-size: 12px; border: 1px solid var(--border); margin-bottom: 25px; transition: 0.2s; cursor: pointer; width: 100%; }
        .btn-fs-trigger:active { background: var(--primary-glow); transform: scale(0.98); }

        .btn-ext-link { display: flex; align-items: center; justify-content: center; gap: 10px; background: rgba(255,255,255,0.05); color: var(--primary); padding: 16px; border-radius: 12px; text-decoration: none; font-weight: 900; font-size: 13px; border: 1px solid var(--border); transition: 0.2s; margin-bottom: 20px; }
        .bayram-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 215, 0, 0.15); color: #FFD700; padding: 6px 12px; border-radius: 50px; font-size: 10px; font-weight: 900; letter-spacing: 1px; margin-bottom: 15px; border: 1px solid rgba(255, 215, 0, 0.3); }

        /* ONAY MODALI */
        #toast, .modal-overlay { position: fixed; display: none; }
        .modal-overlay { top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.96); backdrop-filter: blur(12px); align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-box { background: var(--surface-container); border: 1px solid var(--primary); width: 100%; max-width: 340px; border-radius: 32px; padding: 40px 25px; text-align: center; }
        .modal-icon { font-size: 48px; color: var(--primary); margin-bottom: 20px; }
        .modal-box p { font-size: 15px; line-height: 1.6; color: #fff; margin-bottom: 30px; }
        .modal-box b { color: var(--primary); }
        .modal-actions { display: flex; flex-direction: column; gap: 12px; }
        .m-btn { width: 100%; cursor: pointer; padding: 18px; border-radius: 16px; border: none; font-size: 14px; font-weight: 900; }
        .m-yes { background: var(--primary); color: #000; box-shadow: 0 5px 20px var(--primary-glow); }
        .m-no { background: 0 0; color: var(--text-muted); }
        #toast { bottom: calc(80px + var(--safe-bottom)); left: 50%; transform: translateX(-50%); padding: 14px 30px; border-radius: 50px; z-index: 10000; font-size: 12px; font-weight: 900; background: var(--primary); color: #000; box-shadow: 0 10px 30px var(--primary-glow); }

        /* YENİ EKLENEN RESİM MODALI (LIGHTBOX) STİLLERİ */
        .img-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 10005; opacity: 0; transition: opacity 0.3s ease; }
        .img-modal-overlay.active { display: flex; opacity: 1; }
        .img-modal-content { max-width: 95%; max-height: 90vh; border-radius: 12px; object-fit: contain; transform: scale(0.9); transition: transform 0.3s ease; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .img-modal-overlay.active .img-modal-content { transform: scale(1); }
        .img-modal-close { position: absolute; top: 25px; right: 25px; background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--primary); width: 45px; height: 45px; border-radius: 50%; font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; z-index: 10006; }
        .img-modal-close:active { transform: scale(0.9); background: var(--primary-glow); }

        nav, .bottom-nav { position: fixed !important; bottom: 0 !important; width: 100% !important; max-width: 390px !important; z-index: 9900 !important; }
    </style>
<style id="kg-bayram-card-styles">
/* Yalnızca bayram mesajlarının görünümü; talimat kartları aynı kalır. */
.msg-card.bayram-card{isolation:isolate;overflow:hidden;border:1px solid #625039;border-left:1px solid #625039;background:radial-gradient(ellipse at 100% 0%,rgba(230,192,127,.12),transparent 60%),linear-gradient(145deg,#201c17,#141517 78%);box-shadow:0 12px 30px rgba(0,0,0,.14);padding:21px}
.msg-card.bayram-card .msg-header{gap:12px;align-items:flex-start;margin-bottom:20px}
.msg-card.bayram-card .sender-info{color:#ddc397;font-size:10px;line-height:1.6;min-width:0;overflow-wrap:anywhere}
.msg-card.bayram-card .time{color:#a39783;font-size:9px;line-height:1.6;text-align:right;max-width:115px;flex-shrink:0}
.msg-card.bayram-card .bayram-badge{border:1px solid rgba(228,193,134,.23);background:rgba(228,193,134,.07);color:#e6c895;font-size:8px;font-weight:700;letter-spacing:1.4px;gap:6px;padding:5px 9px;margin-bottom:16px}
.msg-card.bayram-card .bayram-intro{margin:0 0 21px;display:flex;align-items:center;gap:12px}
.msg-card.bayram-card .bayram-emblem{display:grid;place-items:center;flex-shrink:0;width:47px;height:47px;border:1px solid rgba(228,193,134,.2);border-radius:16px;background:rgba(228,193,134,.06);color:#e5c48c}
.msg-card.bayram-card .bayram-emblem svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.msg-card.bayram-card .bayram-intro h2{font-size:23px;line-height:1.25;letter-spacing:-.7px;font-weight:700;color:#f4e2c3;margin:0 0 4px}
.msg-card.bayram-card .bayram-intro p{font-size:10px;line-height:1.6;color:#b5a58e;margin:0}
.msg-card.bayram-card .content{color:#e9e2d6;line-height:1.85;margin-bottom:21px}
.msg-card.bayram-card .bayram-signoff{display:flex;align-items:center;justify-content:center;gap:7px;border-top:1px solid rgba(228,193,134,.12);padding-top:17px;margin-top:5px;color:#cbb48c;font-size:10px;line-height:1.7;font-weight:400;letter-spacing:.1px}
.msg-card.bayram-card .bayram-signoff svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
@media(max-width:350px){.msg-card.bayram-card{padding:18px}.msg-card.bayram-card .bayram-intro{gap:10px}.msg-card.bayram-card .bayram-intro h2{font-size:21px}.msg-card.bayram-card .sender-info{font-size:9px}}
</style>
</head>
<body>

<div id="toast">İŞLEM BAŞARILI</div>

<!-- ONAY MODALI -->
<div id="confirmModal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-icon"><i class="fas fa-shield-halved"></i></div>
        <p id="modalText">...</p>
        <div class="modal-actions">
            <button class="m-btn m-yes" id="finalConfirmBtn">ONAYLIYORUM</button>
            <button class="m-btn m-no" onclick="closeModal()">İPTAL</button>
        </div>
    </div>
</div>

<!-- YENİ EKLENEN RESİM BÜYÜTME MODALI -->
<div id="imageLightboxModal" class="img-modal-overlay" onclick="closeImageModal()">
    <div class="img-modal-close" onclick="closeImageModal()"><i class="fas fa-times"></i></div>
    <img id="lightboxExpandedImg" class="img-modal-content" src="" alt="Büyütülmüş Medya" onclick="event.stopPropagation()">
</div>

<div class="app-container" style="display: none;">
    <header>
        <a href="guvenlik.html" class="back-btn"><i class="fas fa-arrow-left"></i> GERİ</a>
        <div style="text-align: right;">
            <div id="userDisplay" style="font-size: 13px; font-weight: 900; color: var(--primary);">...</div>
            <div style="font-size: 9px; color: var(--text-muted); font-weight: 700;">KOLART GÜVENLİK</div>
        </div>
    </header>

    <main>
        <div class="section-title"><i class="fas fa-bell" style="color: var(--primary)"></i> TALİMATLAR VE MESAJLAR</div>
        <div id="msgList">
            <div style="text-align: center; padding-top: 50px;"><i class="fas fa-circle-notch fa-spin" style="color:var(--primary); font-size: 24px;"></i></div>
        </div>
    </main>
</div>

<script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    const SECURITY_CONFIG = { KEY: "KOLART_SİSTEM_2026_CGA" };

    const decryptAES = (data) => {
        if(!data) return null;
        try {
            const bytes = CryptoJS.AES.decrypt(data, SECURITY_CONFIG.KEY);
            const decrypted = bytes.toString(CryptoJS.enc.Utf8);
            return decrypted ? JSON.parse(decrypted) : null;
        } catch (e) { return null; }
    };

    const siteID = localStorage.getItem("siteID");
    const encryptedConfig = localStorage.getItem("siteConfig");
    const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
    const siteConfig = decryptAES(encryptedConfig);

    if (!siteID || !siteConfig || !currentUser) { 
        window.location.href = "index.html"; 
        throw new Error("Güvenlik ihlali: Yetkisiz erişim denemesi!");
    }

    const app = getApps().find(a => a.name === `siteApp-${siteID}`) || initializeApp(siteConfig, `siteApp-${siteID}`);
    const db = getDatabase(app);
    const auth = getAuth(app);

    document.getElementById("userDisplay").innerText = currentUser.username.toUpperCase();
    const userUID = currentUser.username;

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.querySelector('.app-container').style.display = 'flex';
            loadMessages(); 
        } else {
            window.location.href = "index.html";
        }
    });

    // Eski okunmamış talimatlar da görünür; diğer mesajlarda son 20 sınırı korunur.
    function isUnreadInstruction(message) {
        return message && message.BYR !== true &&
            (!message.is_read || message.is_read === 'false');
    }
    function visibleMessageKeys(data) {
        const time = key => Number(data[key]?.timestamp) || parseInt(key.replace(/^MSG_/, ''), 10) || 0;
        const keys = Object.keys(data).filter(key => data[key] && typeof data[key] === 'object').sort((a, b) =>
            Number(isUnreadInstruction(data[b])) - Number(isUnreadInstruction(data[a])) || time(b) - time(a) || b.localeCompare(a));
        let otherCount = 0;
        return keys.filter(key => isUnreadInstruction(data[key]) || otherCount++ < 20);
    }

    function loadMessages() {
        const messagesQuery = ref(db, `user_messages/${userUID}`);

        onValue(messagesQuery, (snapshot) => {
            const list = document.getElementById("msgList");
            list.innerHTML = "";
            const data = snapshot.val();
            
            if (!data) { 
                list.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:50px; font-weight:800; font-size:12px; letter-spacing:1px;">TALİMAT BULUNMUYOR</div>`; 
                return; 
            }

            let delayIndex = 0;
            
            visibleMessageKeys(data).forEach(key => {
                const msg = data[key];
                const isBayram = msg.BYR === true;
                const isRead = msg.is_read !== "false" && Boolean(msg.is_read);
                
                if (isBayram && !msg.is_read) {
                    update(ref(db, `user_messages/${userUID}/${key}`), { is_read: true, read_at: Date.now() });
                }

                let displayTime = msg.saat || "";
                if (msg.timestamp) {
                    const d = new Date(msg.timestamp);
                    displayTime = `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                }

                let readTimeDisplay = "";
                if (isRead && msg.read_at) {
                    const rd = new Date(msg.read_at);
                    readTimeDisplay = `${String(rd.getDate()).padStart(2,'0')}.${String(rd.getMonth()+1).padStart(2,'0')}.${rd.getFullYear()} ${String(rd.getHours()).padStart(2,'0')}:${String(rd.getMinutes()).padStart(2,'0')}`;
                }

                let mediaHtml = "";
                let mediaType = msg.mediaType || (msg.imageUrl ? 'image' : null);
                let mediaUrl = msg.mediaUrl || msg.imageUrl;
                const mediaId = `media-${key}`; // Her medyaya özel ID

                if (mediaUrl && mediaUrl.toLowerCase().includes('.mp4')) {
                    mediaType = 'video';
                }

                if (mediaUrl) {
                    if (mediaType === 'image') {
                        // DEĞİŞEN KISIM: A etiketi kaldırıldı ve onclick eklendi
                        mediaHtml = `<div class="media-container" style="margin-bottom: 25px;" onclick="openImageModal('${mediaUrl}')"><img src="${mediaUrl}" alt="Medya" loading="lazy"></div>`;
                    } else if (mediaType === 'video') {
                        mediaHtml = `<div class="media-container video-wrapper">
                                        <video id="${mediaId}" controls preload="metadata" playsinline controlsList="nodownload">
                                            <source src="${mediaUrl}" type="video/mp4">
                                        </video>
                                     </div>
                                     <button class="btn-fs-trigger" onclick="triggerNativeFullscreen('${mediaId}')">
                                        <i class="fas fa-expand"></i> TAM EKRAN İZLE
                                     </button>`;
                    } else if (mediaType === 'youtube_link') {
                        mediaHtml = `<div class="media-container video-wrapper">
                                        <iframe id="${mediaId}" src="${mediaUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                                     </div>
                                     <button class="btn-fs-trigger" onclick="triggerNativeFullscreen('${mediaId}')">
                                        <i class="fas fa-expand"></i> TAM EKRAN İZLE
                                     </button>`;
                    } else {
                        mediaHtml = `<a href="${mediaUrl}" target="_blank" class="btn-ext-link"><i class="fas fa-external-link-alt"></i> BAĞLANTIYI AÇ VE İNCELE</a>`;
                    }
                }

                let textContent = msg.content ? `<div class="content">${msg.content}</div>` : '';
                let bayramBadgeHtml = isBayram ? `<div class="bayram-badge"><i class="fas fa-star"></i> BAYRAM MESAJI</div>` : '';
                
                let actionHtml = "";
                if (isBayram) {
                    actionHtml = `<div class="bayram-signoff"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 5a5 5 0 0 0-8 1 5 5 0 0 0-8-1c-4 4 1 9 8 14 7-5 12-10 8-14Z"/></svg>Sevgi, sağlık ve huzurla…</div>`;
                } else {
                    if (isRead) {
                        actionHtml = `<button class="btn-confirm" disabled><i class="fas fa-check"></i> ONAYLANDI</button>`;
                        if (readTimeDisplay) {
                            actionHtml += `<div style="display: flex; justify-content: flex-end; align-items: center; gap: 5px; margin-top: 15px; font-size: 10px; color: var(--text-muted); font-family: monospace; width: 100%;">
                                            <i class="fas fa-check-double" style="color: var(--primary);"></i> Onay: ${readTimeDisplay}
                                          </div>`;
                        }
                    } else {
                        actionHtml = `<button class="btn-confirm" onclick="openModal('${key}', '${msg.from}')">OKUDUM, ANLADIM</button>`;
                    }
                }

                const div = document.createElement("div");
                div.className = `msg-card ${isRead || isBayram ? '' : 'unread'} ${isBayram ? 'bayram-card' : ''}`;
                div.style.animationDelay = `${delayIndex * 0.1}s`; 
                
                div.innerHTML = `
                    <div class="msg-header">
                        <div class="sender-info"><i class="fas fa-user-tie"></i> ${msg.from}</div>
                        <div class="time">${displayTime}</div>
                    </div>
                    ${bayramBadgeHtml}
                    ${textContent}
                    ${mediaHtml}
                    ${actionHtml}
                `;
                
                if (isBayram) {
                    const intro = document.createElement('div');
                    intro.className = 'bayram-intro';
                    intro.innerHTML = `<span class="bayram-emblem" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M5 12h22v6H5zM8 18h16v11H8zM16 12v17M16 12h-6a4 4 0 1 1 4-5l2 5Zm0 0h6a4 4 0 1 0-4-5l-2 5Z"/></svg></span><div><h2>İyi bayramlar</h2><p>Birlikte nice güzel bayramlara.</p></div>`;
                    div.querySelector('.bayram-badge').insertAdjacentElement('afterend', intro);
                    const content = div.querySelector('.content');
                    if (content) content.textContent = String(msg.content || '');
                    const sender = div.querySelector('.sender-info');
                    const senderIcon = document.createElement('i');
                    senderIcon.className = 'fas fa-user-tie';
                    sender.replaceChildren(senderIcon, document.createTextNode(' ' + (msg.from || 'Yönetim')));
                }

                list.appendChild(div);
                delayIndex++;
            });
        });
    }

    // DOĞRUDAN VİDEO İÇİ TAM EKRAN BUTONUNU TETİKLEYEN FONKSİYON
    window.triggerNativeFullscreen = (elementId) => {
        const elem = document.getElementById(elementId);
        if (!elem) return;

        if (elem.tagName.toLowerCase() === 'video' && elem.webkitEnterFullscreen) {
            elem.webkitEnterFullscreen();
            return;
        }

        if (elem.requestFullscreen) {
            elem.requestFullscreen().catch(err => console.log("Tam ekran hatası:", err));
        } else if (elem.webkitRequestFullscreen) {
            elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) {
            elem.msRequestFullscreen();
        }
    };

    // ONAY MODAL FONKSİYONLARI
    let activeKey = null;
    window.openModal = (key, sender) => {
        activeKey = key;
        const currentPerson = currentUser.username.toUpperCase();
        document.getElementById("modalText").innerHTML = `<b>${currentPerson}</b>, Yetkili <b>${sender}</b> tarafından gönderilen talimatı okuduğunuzu ve anladığınızı onaylıyor musunuz?`;
        document.getElementById("confirmModal").style.display = "flex";
    };

    window.closeModal = () => document.getElementById("confirmModal").style.display = "none";

    document.getElementById("finalConfirmBtn").onclick = async () => {
        await update(ref(db, `user_messages/${userUID}/${activeKey}`), { is_read: true, read_at: Date.now() });
        closeModal();
        const t = document.getElementById("toast");
        t.style.display = "block"; setTimeout(() => t.style.display = "none", 2000);
    };

    // YENİ EKLENEN: RESİM MODALI (LIGHTBOX) FONKSİYONLARI
    window.openImageModal = (url) => {
        const modal = document.getElementById("imageLightboxModal");
        const img = document.getElementById("lightboxExpandedImg");
        img.src = url;
        modal.classList.add("active");
    };

    window.closeImageModal = () => {
        const modal = document.getElementById("imageLightboxModal");
        modal.classList.remove("active");
        setTimeout(() => { 
            document.getElementById("lightboxExpandedImg").src = ""; 
        }, 300); // animasyon bittikten sonra src'yi temizler
    };

</script>

<script src="nav.js"></script>
</body>
</html>
