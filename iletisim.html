<!DOCTYPE html>
<html lang="tr" data-theme="elite-neon">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İletişim Ağı - Kolart Sistem</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        :root { 
            --primary: #00ffcc; 
            --primary-glow: rgba(0, 255, 204, 0.3);
            --bg-dark: #0f1015; 
            --msg-sent: #004d40; 
            --msg-received: #1e1f26; 
            --text-main: #ffffff;
            --text-muted: #9ba1a6;
            --danger: #ff4444;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; background: var(--bg-dark); color: var(--text-main); 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            display: flex; flex-direction: column; 
            height: 100dvh; overflow: hidden;
            position: relative;
        }

        .chat-header { 
            padding: 12px 20px; background: rgba(15, 16, 21, 0.95); 
            backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: space-between; 
            border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 10;
        }
        .header-title { display: flex; flex-direction: column; align-items: center; flex: 1; }
        .header-title h3 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
        .header-title span { font-size: 10px; color: var(--primary); margin-top: 2px; text-transform: uppercase; letter-spacing: 1px; }

        #pinned-container {
            background: rgba(0, 255, 204, 0.05);
            border-bottom: 1px solid rgba(0, 255, 204, 0.1);
            display: flex; flex-direction: column; z-index: 9;
        }
        .pinned-item {
            padding: 8px 15px; display: flex; align-items: center; gap: 10px; cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.02); transition: background 0.2s;
        }
        .pinned-item:active { background: rgba(0, 255, 204, 0.15); }
        .pinned-content { flex: 1; overflow: hidden; }
        .pinned-content b { color: var(--primary); font-size: 11px; display: flex; align-items: center; gap: 4px; margin-bottom: 2px; }
        .pinned-content div { color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
        .unpin-btn { color: #666; font-size: 18px; padding: 5px; }

        .chat-container { 
            flex: 1; overflow-y: auto; padding: 20px 15px; 
            display: flex; flex-direction: column; gap: 15px; 
            scroll-behavior: smooth; 
        }
        
        .message-wrapper { display: flex; flex-direction: column; max-width: 85%; animation: fadeIn 0.3s ease; }
        .message-wrapper.sent { align-self: flex-end; align-items: flex-end; }
        .message-wrapper.received { align-self: flex-start; align-items: flex-start; }
        
        .message-bubble { 
            padding: 10px 14px; border-radius: 16px; position: relative; 
            word-wrap: break-word; font-size: 14px; line-height: 1.4;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); border: 1px solid transparent;
        }
        .sent .message-bubble { background: var(--msg-sent); border-bottom-right-radius: 4px; }
        .received .message-bubble { background: var(--msg-received); border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }
        
        .sender-name { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: 500; padding: 0 5px; }
        .msg-time { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 6px; text-align: right; user-select: none; }
        
        @keyframes redGlow {
            0% { box-shadow: 0 0 0px transparent; border-color: transparent; }
            20% { box-shadow: 0 0 20px var(--danger); border-color: var(--danger); }
            80% { box-shadow: 0 0 20px var(--danger); border-color: var(--danger); }
            100% { box-shadow: 0 0 0px transparent; border-color: transparent; }
        }
        .highlight-red .message-bubble { animation: redGlow 3s ease forwards !important; }

        .chat-audio { height: 35px; margin-top: 5px; max-width: 200px; border-radius: 20px; }
        
        .msg-actions { 
            display: none; background: rgba(20, 20, 25, 0.95); backdrop-filter: blur(5px);
            padding: 6px 10px; border-radius: 20px; position: absolute; top: -35px; right: 0; 
            gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 5; border: 1px solid rgba(255,255,255,0.1);
        }
        .message-bubble:active .msg-actions, .message-bubble:focus-within .msg-actions { display: flex; }
        
        .chat-input-area { 
            display: flex; align-items: center; padding: 10px 8px; 
            background: rgba(15, 16, 21, 0.95); 
            padding-bottom: calc(10px + env(safe-area-inset-bottom)); 
            gap: 6px; border-top: 1px solid rgba(255,255,255,0.05);
            flex-wrap: nowrap; 
        }
        .chat-input { 
            flex: 1 1 auto; min-width: 0; 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); 
            color: #fff; padding: 12px 14px; border-radius: 25px; outline: none; font-size: 14px;
        }
        .action-btn { 
            flex: 0 0 auto; 
            background: none; border: none; color: var(--text-muted); 
            font-size: 24px; cursor: pointer; padding: 6px; border-radius: 50%;
        }
        .action-btn.send-btn { color: var(--primary); }

        .recording-indicator {
            display: none; position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 68, 68, 0.15); border: 1px solid var(--danger);
            color: var(--danger); padding: 8px 18px; border-radius: 25px;
            font-size: 13px; font-weight: bold; align-items: center; gap: 8px;
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.4); z-index: 50; backdrop-filter: blur(5px);
            animation: fadeIn 0.3s ease;
        }

        .ui-modal {
            display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100dvh;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            justify-content: center; align-items: center; flex-direction: column;
        }
        .ui-modal-box {
            background: #1a1c23; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px; padding: 25px; width: 85%; max-width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center;
        }
        .ui-modal-title { font-size: 16px; margin-bottom: 15px; font-weight: 600; line-height: 1.4; }
        .ui-modal-input {
            width: 100%; background: #0f1015; border: 1px solid var(--primary); color: #fff;
            padding: 10px; border-radius: 8px; outline: none; margin-bottom: 15px; font-size: 14px;
        }
        .ui-modal-btns { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        .ui-btn { padding: 10px 20px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; flex: 1; }
        .ui-btn-cancel { background: #333; color: #fff; }
        .ui-btn-confirm { background: var(--primary); color: #000; }
        .ui-btn-danger { background: var(--danger); color: #fff; }

        .camera-container { width: 100%; height: 100dvh; background: #000; display: flex; flex-direction: column; position: relative; }
        #cameraFeed { flex: 1; width: 100%; object-fit: cover; }
        .camera-controls { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 30px; }
        .capture-btn { width: 70px; height: 70px; border-radius: 50%; background: #fff; border: 4px solid var(--primary); box-shadow: 0 0 15px var(--primary); cursor: pointer; }
        .close-camera-btn { background: rgba(255,255,255,0.2); color: #fff; border: none; padding: 15px; border-radius: 50%; font-size: 24px; cursor: pointer; backdrop-filter: blur(5px); }

        .img-preview-content { max-width: 95%; max-height: 85%; border-radius: 10px; object-fit: contain; }

        .recording-pulse { animation: pulse 1s infinite; color: var(--danger) !important; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); text-shadow: 0 0 10px var(--danger); } 100% { transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="chat-header">
        <button class="action-btn" onclick="window.history.back()" style="color:white;"><span class="material-symbols-outlined">arrow_back</span></button>
        <div class="header-title">
            <h3 id="headerSiteName">Proje</h3>
            <span>İLETİŞİM AĞI</span>
        </div>
        <span class="material-symbols-outlined" style="color: var(--primary);">wifi_tethering</span>
    </div>

    <div id="pinned-container"></div>
    <div id="chat-window" class="chat-container"></div>

    <div id="recordingIndicator" class="recording-indicator">
        <span class="material-symbols-outlined recording-pulse" style="font-size: 18px;">mic</span>
        Ses Kaydediliyor...
    </div>

    <div class="chat-input-area">
        <button class="action-btn" onclick="document.getElementById('imageInput').click()">
            <span class="material-symbols-outlined">image</span>
        </button>
        <button class="action-btn" onclick="openCameraUI()">
            <span class="material-symbols-outlined">photo_camera</span>
        </button>
        <button class="action-btn" id="micBtn" onclick="toggleRecording()">
            <span class="material-symbols-outlined">mic</span>
        </button>

        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageGallerySelect(event)">
        
        <input type="text" id="msgInput" class="chat-input" placeholder="Mesaj yazın..." onkeypress="handleEnter(event)">
        
        <button class="action-btn send-btn" onclick="sendTextMessage()">
            <span class="material-symbols-outlined">send</span>
        </button>
    </div>

    <div id="modalAlert" class="ui-modal">
        <div class="ui-modal-box">
            <div class="ui-modal-title" id="alertMsg"></div>
            <button class="ui-btn ui-btn-confirm" onclick="document.getElementById('modalAlert').style.display='none'">Tamam</button>
        </div>
    </div>

    <div id="modalConfirm" class="ui-modal">
        <div class="ui-modal-box">
            <div class="ui-modal-title" id="confirmMsg">Bu işlemi onaylıyor musunuz?</div>
            <div class="ui-modal-btns">
                <button class="ui-btn ui-btn-cancel" onclick="document.getElementById('modalConfirm').style.display='none'">İptal</button>
                <button class="ui-btn ui-btn-danger" id="confirmBtnAction">Sil</button>
            </div>
        </div>
    </div>

    <div id="modalPrompt" class="ui-modal">
        <div class="ui-modal-box">
            <div class="ui-modal-title" id="promptMsg">Mesajı Düzenle</div>
            <input type="text" id="promptInput" class="ui-modal-input">
            <div class="ui-modal-btns">
                <button class="ui-btn ui-btn-cancel" onclick="document.getElementById('modalPrompt').style.display='none'">İptal</button>
                <button class="ui-btn ui-btn-confirm" id="promptBtnAction">Kaydet</button>
            </div>
        </div>
    </div>

    <div id="modalCamera" class="ui-modal" style="background:#000;">
        <div class="camera-container">
            <video id="cameraFeed" autoplay playsinline></video>
            <div class="camera-controls">
                <button class="close-camera-btn" onclick="closeCameraUI()"><span class="material-symbols-outlined">close</span></button>
                <button class="capture-btn" onclick="capturePhoto()"></button>
                <div style="width: 54px;"></div>
            </div>
        </div>
    </div>
    <canvas id="hiddenCanvas" style="display:none;"></canvas>

    <div id="modalImageViewer" class="ui-modal">
        <div class="close-camera-btn" style="position:absolute; top:20px; right:20px;" onclick="document.getElementById('modalImageViewer').style.display='none'">
            <span class="material-symbols-outlined">close</span>
        </div>
        <img class="img-preview-content" id="imgViewerSrc">
    </div>
